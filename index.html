<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDC NEKRETNINE — pregled sajta</title><style>
:root{--green:#182b26;--gold:#c9aa73;--cream:#faf8f3;--ink:#27362f}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button,input,select,textarea{font:inherit}a{color:inherit;text-decoration:none}header{height:78px;padding:0 max(5vw,20px);display:flex;align-items:center;justify-content:space-between;background:var(--green);color:white;position:sticky;top:0;z-index:9}.logo{font-family:Georgia,serif;font-size:22px;letter-spacing:1.5px}.logo small{display:block;font-family:Arial;font-size:9px;letter-spacing:4px;color:var(--gold);text-align:center;padding-top:6px}nav{display:flex;gap:25px;font-size:13px;align-items:center}nav button,.mobile button{background:none;border:0;color:inherit;cursor:pointer}nav button:hover{color:var(--gold)}.goldbutton{border:0;background:var(--gold);color:#192a25;padding:15px 22px;cursor:pointer;font-weight:700}.hero{min-height:570px;display:flex;align-items:center;background:linear-gradient(90deg,rgba(9,29,24,.88) 0%,rgba(9,29,24,.55) 52%,rgba(9,29,24,.08) 100%),url('https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1800&q=85') center/cover;color:white}.wrap{max-width:1170px;margin:auto;padding:0 24px}.hero-inner{width:100%;padding-top:40px;padding-bottom:70px}.eyebrow{font-size:11px;letter-spacing:3px;font-weight:700;color:var(--gold)}h1,h2,h3{font-family:Georgia,serif;font-weight:400}h1{font-size:clamp(46px,6vw,85px);line-height:1.05;margin:22px 0}em{color:var(--gold);font-weight:400}p{line-height:1.7}.hero p{max-width:490px;color:#e3e5e0}.search-panel{background:white;box-shadow:0 12px 40px #00000015;margin:-52px auto 68px;position:relative;z-index:2;padding:24px;display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:12px;align-items:end}.field label{display:block;font-size:11px;letter-spacing:1px;font-weight:bold;margin-bottom:9px}.field input,.field select,.form input,.form textarea,.form select{width:100%;border:1px solid #e0e0d9;background:#fff;padding:14px;color:#25352e}.darkbutton{background:var(--green);color:white;border:0;padding:15px 20px;cursor:pointer}.section{padding:70px 0}h2{font-size:clamp(33px,4vw,53px);margin:13px 0 18px}.muted{color:#69726b}.headrow{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:32px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.card{background:white;border:1px solid #e9e8e1;cursor:pointer;transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 30px #00000012}.photo{height:230px;background-size:cover;background-position:center;position:relative}.pill{position:absolute;top:14px;left:14px;background:#fffdf2;color:#2d4338;padding:8px 12px;font-size:11px;font-weight:bold;letter-spacing:.7px}.body{padding:20px}.district{font-size:11px;letter-spacing:1.8px;color:#8f8775;font-weight:700}.body h3{font-size:23px;margin:10px 0}.price{font-size:21px;font-weight:700;color:#243c32}.specs{border-top:1px solid #eeeae2;padding-top:15px;color:#69726b;font-size:13px;display:flex;gap:15px;margin-top:15px}.split{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}.featureimage{width:100%;height:470px;object-fit:cover}.green{background:var(--green);color:white}.green p{color:#d4dfd8}.band{padding:55px 0}.footer{background:#101d19;color:#d8e0dc;padding:35px 0;font-size:12px}.tag{font-size:12px;color:#96825f}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:28px}.form{display:grid;gap:14px;max-width:650px}.form label{font-size:13px;font-weight:bold;display:grid;gap:7px}.form textarea{min-height:115px}.notice{background:#eae5d7;border-left:3px solid var(--gold);padding:15px 18px;font-size:13px;line-height:1.6}.detailgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:30px}.detailphoto{height:420px;background-size:cover;background-position:center}.panel{background:white;padding:27px;border:1px solid #e7e8df}.admin-row{background:white;border:1px solid #e5e4db;padding:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;margin:8px 0}.admin-row button{padding:8px 12px;border:1px solid #d4c7aa;background:white;cursor:pointer}.mobile{display:none}#toast{position:fixed;bottom:20px;right:20px;background:#193328;color:white;padding:14px 20px;box-shadow:0 4px 20px #0004;z-index:20;display:none}footer a{cursor:pointer}@media(max-width:850px){header{height:70px}.mobile{display:block}.desktopnav{display:none}nav{position:absolute;top:70px;left:0;right:0;background:var(--green);display:none;flex-direction:column;padding:20px;align-items:start}nav.open{display:flex}.search-panel{grid-template-columns:1fr 1fr;margin:-35px 20px 40px}.cards{grid-template-columns:repeat(2,1fr)}.split,.detailgrid{grid-template-columns:1fr}.featureimage{height:350px}}@media(max-width:540px){.cards,.search-panel{grid-template-columns:1fr}.hero{min-height:490px}.hero-inner{padding-bottom:60px}.section{padding:40px 0}.photo{height:220px}.headrow{display:block}.logo{font-size:18px}}
</style></head><body><header><a class="logo" href="#" onclick="go('home');return false">IDC NEKRETNINE<small>REAL ESTATE · BELGRADE</small></a><div class="mobile"><button onclick="document.querySelector('nav').classList.toggle('open')">☰ Мени</button></div><nav class="desktopnav"><button onclick="go('home')">Почетна</button><button onclick="go('list')">Некретнине</button><button onclick="go('about')">О нама</button><button onclick="go('contact')">Контакт</button><button onclick="go('admin')">Админ преглед</button></nav></header><main id="app"></main><footer class="footer"><div class="wrap">IDC NEKRETNINE · Београд · <span class="tag">ПРЕГЛЕДНА ВЕРЗИЈА — огласи су примерни, не стварне понуде.</span></div></footer><div id="toast"></div><script>
const initial=[{id:1,name:'Резиденција Врачар',district:'Врачар',price:185000,area:68,rooms:3,deal:'prodaja',photo:'https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=900&q=80',desc:'Светао дневни простор и функционалан распоред.'},{id:2,name:'Панорама Нови Београд',district:'Нови Београд',price:269000,area:92,rooms:4,deal:'prodaja',photo:'https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=900&q=80',desc:'Пространа породична некретнина са отвореном дневном зоном.'},{id:3,name:'Дорћол Лофт',district:'Дорћол',price:145000,area:51,rooms:2,deal:'prodaja',photo:'https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=900&q=80',desc:'Топли материјали и савремена естетика.'},{id:4,name:'Urban Residence',district:'Савски венац',price:390000,area:120,rooms:4,deal:'prodaja',photo:'https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&w=900&q=80',desc:'Велика дневна зона и складан распоред.'},{id:5,name:'Студио Звездара',district:'Звездара',price:890,area:44,rooms:2,deal:'izdavanje',photo:'https://images.unsplash.com/photo-1600607688969-a5bfcd646154?auto=format&fit=crop&w=900&q=80',desc:'Функционалан стан модерног ентеријера.'},{id:6,name:'Сењак Penthouse',district:'Сењак',price:680000,area:178,rooms:5,deal:'prodaja',photo:'https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?auto=format&fit=crop&w=900&q=80',desc:'Простран дом са мирном палетом тонова.'}];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let listings=initial.map(x=>({...x})),filters={q:'',deal:'',max:''};let app=document.getElementById('app');const money=n=>Number(n).toLocaleString('de-DE')+' €';const photo=(url)=>esc(url);function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',3100)}function go(page,id){document.querySelector('nav').classList.remove('open');window.scrollTo(0,0);history.replaceState(null,'','#'+page+(id?'-'+id:''));if(page==='home')home();if(page==='list')list();if(page==='detail')detail(id);if(page==='about')about();if(page==='contact')contact();if(page==='admin')admin();}function card(x){return `<div class="card" onclick="go('detail',${x.id})"><div class="photo" style="background-image:url('${photo(x.photo)}')"><span class="pill">ПРИМЕР · ${x.deal==='prodaja'?'ПРОДАЈА':'ИЗДАВАЊЕ'}</span></div><div class="body"><div class="district">${esc(x.district).toUpperCase()} · БЕОГРАД</div><h3>${esc(x.name)}</h3><div class="price">${money(x.price)}${x.deal==='izdavanje'?'/мес.':''}</div><div class="specs"><span>◻ ${x.area} m²</span><span>⌂ ${x.rooms} собе</span><span>Погледај ↗</span></div></div></div>`}function search(){return `<div class="wrap search-panel"><div class="field"><label>ЛОКАЦИЈА / ПОЈАМ</label><input id="q" placeholder="Врачар, Дорћол..." value="${esc(filters.q)}"></div><div class="field"><label>ВРСТА ПОНУДЕ</label><select id="deal"><option value="">Све понуде</option><option value="prodaja" ${filters.deal==='prodaja'?'selected':''}>Продаја</option><option value="izdavanje" ${filters.deal==='izdavanje'?'selected':''}>Издавање</option></select></div><div class="field"><label>МАКСИМАЛНА ЦЕНА (€)</label><input id="max" type="number" min="0" value="${esc(filters.max)}" placeholder="Без ограничења"></div><button class="darkbutton" onclick="applySearch()">Претражи ↗</button></div>`}function applySearch(){filters={q:document.getElementById('q').value,deal:document.getElementById('deal').value,max:document.getElementById('max').value};go('list')}function home(){app.innerHTML=`<section class="hero"><div class="wrap hero-inner"><div class="eyebrow">БЕОГРАД · НОВА ПЕРСПЕКТИВА НЕКРЕТНИНА</div><h1>Простор за<br><em>вашу следећу</em><br>причу.</h1><p>Откријте некретнине које одговарају вашем животу. Промишљен избор, јасне информације и савремен приступ.</p><button class="goldbutton" onclick="go('list')">Истражите некретнине ↗</button></div></section>${search()}<section class="section"><div class="wrap"><div class="headrow"><div><div class="eyebrow">ПАЖЉИВО ОДАБРАНИ ПРОСТОРИ</div><h2>Истакнуте <em>некретнине.</em></h2><p class="muted">Пример изгледа огласа — ово нису стварне понуде.</p></div><button class="darkbutton" onclick="go('list')">Сви огласи ↗</button></div><div class="cards">${listings.slice(0,3).map(card).join('')}</div></div></section><section class="section" style="background:#f0eee7"><div class="wrap split"><img class="featureimage" src="https://images.unsplash.com/photo-1600566752355-35792bedcfea?auto=format&fit=crop&w=1000&q=80"><div><div class="eyebrow">ВИШЕ ОД КВАДРАТА</div><h2>Некретнина је више од <em>адресе.</em></h2><p class="muted">Верујемо да добар простор треба да одговара вашим потребама, начину живота и плановима. Не гледамо само квадратуру — гледамо ширу слику.</p><button class="darkbutton" onclick="go('about')">О нашем приступу ↗</button></div></div></section><section class="green band"><div class="wrap headrow"><div><div class="eyebrow">ПОЧНИМО ОД РАЗГОВОРА</div><h2>Тражите идеалан простор?</h2></div><button class="goldbutton" onclick="go('contact')">Контактирајте нас ↗</button></div></section>`}function list(){let filtered=listings.filter(x=>(!filters.q||(x.district+' '+x.name).toLowerCase().includes(filters.q.trim().toLowerCase()))&&(!filters.deal||x.deal===filters.deal)&&(!filters.max||x.price<=Number(filters.max)));app.innerHTML=`<section class="section"><div class="wrap"><div class="eyebrow">IDC NEKRETNINE / ПОНУДА</div><h2>Истражите <em>некретнине.</em></h2><p class="muted">Филтрирајте примерне огласе по делу града, цени и типу понуде.</p></div></section>${search()}<section class="wrap" style="padding-bottom:85px"><div class="toolbar"><strong>${filtered.length} резултата</strong><button class="darkbutton" onclick="filters={q:'',deal:'',max:''};go('list')">Очисти филтере</button></div><div class="cards">${filtered.length?filtered.map(card).join(''):'<p>Нема огласа који одговарају претрази.</p>'}</div></section>`}function detail(id){let x=listings.find(v=>v.id===Number(id));if(!x)return go('list');app.innerHTML=`<section class="section"><div class="wrap"><button class="darkbutton" onclick="go('list')">← Назад на понуду</button><div style="height:25px"></div><div class="eyebrow">${esc(x.district).toUpperCase()} / ПРИМЕР ОГЛАСА</div><h2>${esc(x.name)}</h2><div class="detailgrid"><div><div class="detailphoto" style="background-image:url('${photo(x.photo)}')"></div><div class="panel"><h3>О некретнини</h3><p>${esc(x.desc)}</p><p class="muted">Ово је примерни оглас ради приказа изгледа сајта. Некретнина, цена и опис нису проверена стварна понуда.</p></div></div><aside class="panel" style="align-self:start"><div class="eyebrow">${x.deal==='prodaja'?'ПРОДАЈА':'ИЗДАВАЊЕ'}</div><h2>${money(x.price)}</h2><p>${esc(x.district)}, Београд</p><hr style="border:0;border-top:1px solid #eee"><p><b>Површина:</b> ${x.area} m²</p><p><b>Собе:</b> ${x.rooms}</p><p><b>Врста:</b> Стан</p><button class="darkbutton" style="width:100%" onclick="go('contact')">Пошаљите упит ↗</button></aside></div></div></section>`}function about(){app.innerHTML=`<section class="section"><div class="wrap split"><div><div class="eyebrow">НАШ ПРИСТУП</div><h2>Простори са <em>карактером.</em></h2><p class="muted">IDC NEKRETNINE је привремени назив за будући бренд у Београду. Сајт је осмишљен за представљање некретнина уз јасне информације, леп визуелни приказ и директан контакт са заинтересованим купцима и власницима.</p><p class="muted">Овде ћемо додати вашу праву причу, тим, услуге, портфолио и контакт податке када их утврдимо.</p><button class="darkbutton" onclick="go('contact')">Контакт ↗</button></div><img class="featureimage" src="https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1000&q=80"></div></section>`}function contact(){app.innerHTML=`<section class="section"><div class="wrap split"><div><div class="eyebrow">КОНТАКТ</div><h2>Почнимо <em>разговор.</em></h2><p class="muted">Имате питање о некретнини, куповини, продаји или сарадњи? Овде ће се налазити контакт подаци ваше фирме.</p><div class="notice">Ово је верзија за преглед. Поруке из овог обрасца се не шаљу агенцији.</div></div><form class="form panel" onsubmit="event.preventDefault();this.reset();toast('Ово је преглед — порука није послата.')"><label>Ваше име<input required placeholder="Име и презиме"></label><label>Е-мејл<input type="email" required placeholder="ime@primer.rs"></label><label>Шта вас занима?<select><option>Куповина</option><option>Продаја</option><option>Издавање</option><option>Друго</option></select></label><label>Порука<textarea required placeholder="Напишите свој упит..."></textarea></label><button class="darkbutton">Пошаљи упит (демо)</button></form></div></section>`}function admin(){app.innerHTML=`<section class="section"><div class="wrap"><div class="eyebrow">АДМИН / ПРЕГЛЕД</div><h2>Управљање <em>огласима.</em></h2><div class="notice">Ово је само интерактивни преглед административног дела. Измене су привремене и не чувају се на серверу. Права верзија сајта има одвојен админ приступ.</div><div class="split" style="margin-top:30px;align-items:start"><form class="form panel" onsubmit="addListing(event)"><h3>Додај пример огласа</h3><label>Назив<input name="name" required maxlength="70" placeholder="Назив стана"></label><label>Локација<input name="district" required maxlength="40" placeholder="Нови Београд"></label><label>Цена (€)<input name="price" required type="number" min="1"></label><label>Површина (m²)<input name="area" required type="number" min="1"></label><label>Број соба<input name="rooms" required type="number" min="1"></label><label>Тип понуде<select name="deal"><option value="prodaja">Продаја</option><option value="izdavanje">Издавање</option></select></label><button class="darkbutton">Додај у преглед</button></form><div><h3>Тренутни примерни огласи</h3><div id="rows">${listings.map(x=>`<div class="admin-row"><span>${esc(x.name)}</span><button onclick="removeListing(${x.id})">Уклони</button></div>`).join('')}</div><button class="goldbutton" style="margin-top:20px" onclick="listings=initial.map(x=>({...x}));go('admin')">Врати примерне огласе</button></div></div></div></section>`}function addListing(e){e.preventDefault();const f=new FormData(e.target);listings.unshift({id:Date.now(),name:String(f.get('name')).trim(),district:String(f.get('district')).trim(),price:+f.get('price'),area:+f.get('area'),rooms:+f.get('rooms'),deal:f.get('deal'),photo:'https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=900&q=80',desc:'Нови примерни оглас — привремени подаци.'});toast('Пример огласа је додат у овом прегледу.');go('admin')}function removeListing(id){listings=listings.filter(x=>x.id!==id);go('admin')}let hash=location.hash.slice(1).split('-');go(['home','list','detail','about','contact','admin'].includes(hash[0])?hash[0]:'home',hash[1]);
</script></body></html>
